[workspace]
members = [ "crates/core", "crates/main", "crates/render" ]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fvi = { path = "crates/main" }
fvi-core = { path = "crates/core" }
fvi-render = { path = "crates/render" }

bytemuck = "1.25"
etagere = "0.3"
fontdb = "0.24"
hashbrown = "0.17"
harfrust = "0.13"
nalgebra = "0.35"
swash = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
wgpu = "30.0"
wgsl_bindgen = "0.23"
winit = "0.30"

# test
criterion = "0.8"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
filetype_is_file = "warn"
wildcard_imports = "allow"
