[workspace]
members = [ "crates/core", "crates/main" ]
resolver = "3"

[workspace.dependencies]
fvi-core = { path = "crates/core" }
fvi-main = { path = "crates/main" }

# logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"

# graphics
kurbo = "0.13"
pollster = "0.4"
vello = "0.9"
winit = "0.30"
wgpu = "30.0"
wgpu-profiler = "0.27"

# testing
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
filetype_is_file = "warn"
unreachable = "warn"
unwrap_used = "warn"
