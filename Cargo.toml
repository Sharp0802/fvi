[workspace]
members = [ "crates/core", "crates/main" ]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fvi = { path = "crates/main" }
fvi-core = { path = "crates/core" }

bytemuck = "1.25"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wgpu = "30.0"
winit = "0.30"

# test
criterion = "0.8"
proptest = "1"

# macro
proc-macro2 = "1.0"
quote = "1.0"
venial = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
filetype_is_file = "warn"
unreachable = "warn"
unwrap_used = "warn"
wildcard_imports = "allow"
