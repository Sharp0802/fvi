[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
ignore = [
    "RUSTSEC-2025-0057", # fxhash (wgsl-bindgen)
    "RUSTSEC-2026-0192", # ttf-parser (winit)
]

[bans]
multiple-versions = "allow"
